<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>{{TITLE}}</title>
<meta name="description" content="{{DESC}}">
<meta property="og:type" content="product">
<meta property="og:title" content="{{TITLE}}">
<meta property="og:description" content="{{DESC}}">
<meta property="og:image" content="{{IMAGE}}">
<meta name="theme-color" content="#07060f">
{{PIXEL}}
<link rel="icon" href="/favicon.svg">
<link rel="stylesheet" href="/css/styles.css">
<style>
.offer{margin:14px 0;padding:14px 16px;border-radius:16px;background:linear-gradient(135deg,#7c5cff33,#ff4fa333);border:1px solid #ffffff22}
.offer h4{margin:0 0 6px;font-size:1.02rem}.offer p{margin:4px 0;color:var(--dim,#aab);font-size:.92rem}
.offer .row{display:flex;gap:8px;margin-top:8px}.offer input{flex:1;min-width:0}.offer .btn{white-space:nowrap}
.pack-list{list-style:none;padding:0;margin:8px 0}.pack-list li{padding:4px 0}
.coupon-line{margin:8px 0 0;font-size:.9rem}.coupon-line a{color:#b9a6ff;cursor:pointer}
.ok{color:#5fe3a1}
</style>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
<div class="bg-orbs"><span></span><span></span><span></span></div><div class="bg-grid"></div>
<header class="top"><div class="wrap">
  <a class="logo" href="/"><i>✦</i><span>{{STORE}}</span></a>
  <nav class="nav"><a href="/#catalogo" data-t="catalog">Catálogo</a><button class="lang">EN</button></nav>
</div></header>

<main class="wrap pdp" id="pdp"></main>

<footer><div class="wrap"><span>{{STORE}}</span><span><a href="/legal">Términos y privacidad</a></span></div></footer>

<script src="/js/common.js"></script>
<script>
const P = {{DATA}};
let CFG = {}, METHOD = '', ORDER = null;
const QS = new URLSearchParams(location.search);
let PRICE = P.price, COUPON = '', UPSELL = null;   // precio final, cupón aplicado, oferta "completa tu pack"

function priceBox() {
  const off = P.compare > PRICE ? Math.round((1 - PRICE / P.compare) * 100) : 0;
  const was = UPSELL ? UPSELL.normal : COUPON ? P.price : P.compare;
  return `<b>${inTelegram ? P.stars + ' ⭐' : money(PRICE)}</b>${!inTelegram && was > PRICE ? `<s>${money(was)}</s><span class="save">-${Math.round((1 - PRICE / was) * 100)}%</span>` : (off && !inTelegram ? `<s>${money(P.compare)}</s><span class="save">-${off}%</span>` : '')}`;
}
function refreshPrice() { const b = $('.big-price'); if (b) b.innerHTML = priceBox(); }

function offersHtml() {
  if (inTelegram) return '';
  let h = '';
  if (UPSELL) h += `<div class="offer"><h4>🎁 Oferta solo para ti: completa tu pack</h4><p>Por haber comprado, te llevas ${UPSELL.items.map((i) => `${escH(i.emoji)} <b>${escH(i.title)}</b>`).join(' + ')} por solo <b>${money(UPSELL.price)}</b> (normalmente ${money(UPSELL.normal)}).</p></div>`;
  if (P.pack) h += `<div class="offer"><h4>📦 Este pack incluye</h4><ul class="pack-list">${P.pack.map((i) => `<li>${escH(i.emoji)} ${escH(i.title)} <small style="color:var(--dim)">(${money(i.price)})</small></li>`).join('')}</ul></div>`;
  for (const k of (P.packs || []).slice(0, 1)) h += `<a class="offer" style="display:block;text-decoration:none;color:inherit" href="/p/${encodeURIComponent(k.slug)}">
      <h4>🔥 Llévate los ${k.items.length} por ${money(k.price)}</h4><p>${k.items.map((i) => escH(i.emoji) + ' ' + escH(i.title)).join(' · ')}</p>
      <p><b>Ahorras ${money(k.save)}</b> · <u>Ver el pack →</u></p></a>`;
  if (!P.pack && !UPSELL) h += `<div class="offer" id="welcome"><h4>🎁 ¿Primera compra? 15% de descuento</h4>
      <p>Déjanos tu correo y te damos tu cupón al instante (también te avisamos de novedades).</p>
      <div class="row"><input id="subEmail" type="email" placeholder="tu@correo.com" autocomplete="email"><button class="btn btn-main" id="subBtn">Quiero mi 15%</button></div>
      <p class="err" id="subErr"></p></div>`;
  return h;
}

function wireOffers() {
  const sb = $('#subBtn'); if (!sb) return;
  sb.onclick = async () => {
    $('#subErr').textContent = ''; sb.disabled = true;
    try {
      const email = $('#subEmail').value.trim();
      const r = await api('/api/subscribe', { method: 'POST', body: { email, source: P.slug } });
      try { localStorage.setItem('px_coupon', r.code); } catch {}
      fbq('track', 'Lead', { content_name: 'cupon-bienvenida' });
      await applyCoupon(r.code, true);
      if ($('#email') && !$('#email').value) $('#email').value = email;
      $('#welcome').innerHTML = `<h4 class="ok">✅ ¡Listo! Cupón <b>${escH(r.code)}</b> aplicado (-${r.off}%)</h4><p>También te lo enviamos por correo.</p>`;
    } catch (e) { $('#subErr').textContent = e.message; sb.disabled = false; }
  };
}

async function applyCoupon(code, silent) {
  const r = await api('/api/coupon', { method: 'POST', body: { slug: P.slug, code } });
  COUPON = r.code; PRICE = r.price; refreshPrice();
  const cl = $('#couponLine'); if (cl) cl.innerHTML = `<span class="ok">✅ Cupón ${escH(r.code)} aplicado: -${r.off}%</span>`;
  if (METHOD === 'paypal') pick('paypal');  // vuelve a dibujar PayPal con el precio nuevo
  return r;
}

const RV_LAB = { compra: '✅ Compra verificada', regalo: '🎁 Descargó el regalo', gratis: '🎁 Lo recibió gratis para opinar' };
function reviewsHtml() {
  const R = P.reviews || [];
  if (!R.length) return '';
  return `<div class="reveal" id="resenas" style="margin-top:26px"><h3 style="margin:0 0 10px">⭐ Opiniones reales (${P.rating.avg} de 5)</h3>` + R.map((r) =>
    `<div style="padding:12px 14px;border:1px solid var(--line);border-radius:16px;margin:8px 0;background:#ffffff08">
      <div style="color:#ffc83d">${'★'.repeat(r.stars)}<span style="color:#ffffff33">${'★'.repeat(5 - r.stars)}</span></div>
      ${r.text ? `<p style="margin:6px 0">${escH(r.text)}</p>` : ''}
      <div style="font-size:.82rem;color:var(--mut)">${escH(r.name || 'Cliente')} · ${RV_LAB[r.source] || ''} · ${escH(String(r.created_at).slice(0, 10))}</div></div>`).join('') + '</div>';
}

function view() {
  const off = P.compare > P.price ? Math.round((1 - P.price / P.compare) * 100) : 0;
  $('#pdp').innerHTML = `
  <div class="media reveal"><img src="${escH(P.cover)}" alt="${escH(P.title)}"></div>
  <div>
    <div class="crumbs reveal"><a href="/">Inicio</a> / <a href="/#catalogo">${escH(P.category)}</a></div>
    <h1 class="reveal">${escH(P.emoji)} ${escH(P.title)}</h1>
    ${P.rating && P.rating.n ? `<a href="#resenas" class="reveal" style="display:inline-block;margin:-4px 0 8px;color:#ffc83d;text-decoration:none">${'★'.repeat(Math.round(P.rating.avg))}${'☆'.repeat(5 - Math.round(P.rating.avg))} <span style="color:var(--mut)">${P.rating.avg} · ${P.rating.n} ${P.rating.n === 1 ? 'opinión' : 'opiniones'}</span></a>` : ''}
    <p class="short reveal">${escH(P.short)}</p>
    <div class="big-price reveal">${priceBox()}</div>
    ${offersHtml()}
    <div class="checkout reveal" id="checkout"></div>
    <div class="feats reveal"><div>⚡ ${t('instant')}</div><div>📩 Correo · Telegram · WhatsApp</div><div>🔁 Descarga hasta 5 veces</div><div>💬 Soporte por Telegram</div><div>✅ Garantía: si tu archivo falla, lo arreglamos o te devolvemos el dinero</div></div>
    <div class="desc reveal">${escH(P.description)}</div>
    ${reviewsHtml()}
  </div>`;
  enhance(); wireOffers();
}

function checkoutTelegram() {
  $('#checkout').innerHTML = `<h3>${t('stars')}</h3>
    <button class="btn btn-main btn-block" id="starsBtn">Comprar por ${P.stars} ⭐</button>
    <p class="hint">Recibirás el archivo en este chat al instante.</p><div class="err" id="err"></div>`;
  $('#starsBtn').onclick = async () => {
    $('#starsBtn').disabled = true; $('#err').textContent = '';
    try {
      const { link } = await api('/api/stars/invoice', { method: 'POST', body: { slug: P.slug, initData: TG.initData } });
      TG.openInvoice(link, (status) => {
        $('#starsBtn').disabled = false;
        if (status === 'paid') { TG.HapticFeedback?.notificationOccurred('success');
          $('#checkout').innerHTML = `<h3>🎉 ¡Pago completado!</h3><p class="hint">Te enviamos el producto al chat del bot.</p>
            <button class="btn btn-ghost btn-block" onclick="TG.close()">Ir al chat</button>`; }
      });
    } catch (e) { $('#err').textContent = e.message; $('#starsBtn').disabled = false; }
  };
}

function checkoutWeb() {
  const methods = [];
  if (CFG.paypal) methods.push(['paypal', 'PayPal', 'Tarjeta o saldo']);
  if (CFG.binance) methods.push(['binance', 'Binance', 'USDT · Pay']);
  if (CFG.bot && P.stars) methods.push(['stars', '⭐ Stars', 'en Telegram']);
  if (!methods.length) { $('#checkout').innerHTML = '<p class="hint">Los pagos aún no están configurados.</p>'; return; }
  $('#checkout').innerHTML = `
    <h3>${t('sendTo')}</h3>
    <div class="field"><label>${t('email')}</label><input id="email" type="email" placeholder="tu@correo.com" autocomplete="email"></div>
    ${CFG.whatsapp ? `<div class="field"><label>${t('whatsapp')}</label><input id="wa" type="tel" placeholder="+58 412 1234567" autocomplete="tel"></div>` : ''}
    <h3 style="margin-top:18px">${t('payWith')}</h3>
    <div class="methods">${methods.map(([k, n, s]) => `<button class="method" data-m="${k}">${n}<small>${s}</small></button>`).join('')}</div>
    <div id="pay"></div><div class="err" id="err"></div>
    ${!P.pack && !UPSELL ? `<p class="coupon-line" id="couponLine"><a id="haveCoupon">¿Tienes un cupón?</a></p>` : ''}`;
  const hc = $('#haveCoupon');
  if (hc) hc.onclick = () => {
    $('#couponLine').innerHTML = `<span class="row" style="display:flex;gap:8px"><input id="cpn" placeholder="HOLA-XXXXXX" style="flex:1"><button class="btn btn-ghost" id="cpnBtn">Aplicar</button></span>`;
    $('#cpnBtn').onclick = () => applyCoupon($('#cpn').value).catch((e) => { $('#err').textContent = e.message; });
  };
  $('.methods').onclick = (e) => { const b = e.target.closest('.method'); if (b) pick(b.dataset.m); };
  pick(methods[0][0]);
}

function contact() {
  const email = $('#email').value.trim(), whatsapp = $('#wa')?.value.trim() || '';
  if (!email && !whatsapp) throw new Error('Escribe tu correo para enviarte el producto.');
  if (email && !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) throw new Error('Revisa tu correo.');
  return { email, whatsapp };
}

async function createOrder(method) {
  $('#err').textContent = '';
  ORDER = await api('/api/orders', { method: 'POST', body: { slug: P.slug, method, lang: LANG, ...contact(),
    coupon: COUPON || undefined, upsell: UPSELL ? { id: QS.get('up'), key: QS.get('k') } : undefined } });
  fbq('track', 'InitiateCheckout', { content_ids: [P.slug], value: PRICE, currency: 'USD' });
  return ORDER;
}

function pick(m) {
  METHOD = m; $$('.method').forEach((b) => b.classList.toggle('on', b.dataset.m === m)); $('#err').textContent = '';
  const pay = $('#pay');
  if (m === 'paypal') { pay.innerHTML = '<div id="paypal-buttons"></div>'; loadPaypal(); }
  if (m === 'binance') {
    pay.innerHTML = `<button class="btn btn-main btn-block" id="bnBtn">${t('continue')} con Binance</button>`;
    $('#bnBtn').onclick = async () => {
      try { $('#bnBtn').disabled = true; const o = await createOrder('binance'); binanceSteps(o); }
      catch (e) { $('#err').textContent = e.message; $('#bnBtn').disabled = false; }
    };
  }
  if (m === 'stars') pay.innerHTML = `<a class="btn btn-main btn-block" href="https://t.me/${CFG.bot}?start=p_${encodeURIComponent(P.slug)}" target="_blank">Abrir en Telegram · ${P.stars} ⭐</a>
    <p class="hint">Pagas con Telegram Stars dentro del bot y recibes el archivo en el chat.</p>`;
}

function loadPaypal() {
  const render = () => paypal.Buttons({
    style: { shape: 'pill', color: 'gold', layout: 'vertical', label: 'pay' },
    onClick: (_, actions) => { try { contact(); return actions.resolve(); } catch (e) { $('#err').textContent = e.message; return actions.reject(); } },
    createOrder: async () => (await createOrder('paypal')).paypalId,
    onApprove: async () => {
      $('#pay').innerHTML = '<div class="spinner"></div>';
      try { await api('/api/paypal/capture', { method: 'POST', body: { id: ORDER.id, key: ORDER.key } }); }
      catch (e) { $('#err').textContent = e.message; }
      location.href = `/pedido/${ORDER.id}?k=${ORDER.key}`;
    },
    onError: () => { $('#err').textContent = 'PayPal no pudo procesar el pago. Inténtalo de nuevo.'; },
  }).render('#paypal-buttons');
  if (window.paypal) return render();
  const s = document.createElement('script');
  s.src = `https://www.paypal.com/sdk/js?client-id=${encodeURIComponent(CFG.paypal.clientId)}&currency=USD&intent=capture`;
  s.onload = render; s.onerror = () => { $('#err').textContent = 'No se pudo cargar PayPal.'; };
  document.head.appendChild(s);
}

function binanceSteps(o) {
  $('.methods').style.display = 'none';
  $('#pay').innerHTML = `
    <div class="box"><ol class="binance">
      <li>Abre Binance → <b>Pay</b> → <b>Enviar</b>.</li>
      <li>Envía <b>exactamente</b> este importe en USDT (los céntimos identifican tu pedido):
        <div class="copy"><b>${o.amount} USDT</b><button data-c="${o.amount}">${t('copy')}</button></div></li>
      <li>Al Binance Pay ID:<div class="copy"><b>${escH(o.payId)}</b><button data-c="${escH(o.payId)}">${t('copy')}</button></div></li>
      <li>Copia el <b>ID de orden</b> que te muestra Binance y pégalo aquí:</li>
    </ol>
    <div class="field" style="margin-top:10px"><input id="ref" placeholder="ID de orden de Binance" inputmode="numeric"></div>
    <button class="btn btn-main btn-block" id="sendRef">Ya pagué</button>
    <p class="hint">Pedido <b>${o.id}</b>. Normalmente lo confirmamos en pocos minutos.</p></div>`;
  $$('.copy button').forEach((b) => (b.onclick = () => copyText(b.dataset.c)));
  $('#sendRef').onclick = async () => {
    $('#sendRef').disabled = true; $('#err').textContent = '';
    try {
      await api('/api/binance/submit', { method: 'POST', body: { id: o.id, key: o.key, ref: $('#ref').value } });
      location.href = `/pedido/${o.id}?k=${o.key}`;
    } catch (e) { $('#err').textContent = e.message; $('#sendRef').disabled = false; }
  };
}

async function start() {
  // ¿Viene de "completa tu pack"? (enlace desde la página del pedido)
  if (QS.get('up') && QS.get('k') && P.pack) {
    try {
      const o = await api(`/api/orders/${encodeURIComponent(QS.get('up'))}?k=${encodeURIComponent(QS.get('k'))}`);
      if (o.upsell && o.upsell.slug === P.slug) { UPSELL = o.upsell; PRICE = o.upsell.price; UPSELL.email = o.email; }
    } catch {}
  }
  view();
  fbq('track', 'ViewContent', { content_ids: [P.slug], content_type: 'product', value: PRICE, currency: 'USD' });
  if (inTelegram) return checkoutTelegram();
  CFG = await api('/api/config'); checkoutWeb();
  if (UPSELL?.email && $('#email')) $('#email').value = UPSELL.email;
  // cupón guardado de una visita anterior
  let saved = ''; try { saved = localStorage.getItem('px_coupon') || ''; } catch {}
  if (saved && !P.pack && !UPSELL) applyCoupon(saved).then(() => { const w = $('#welcome'); if (w) w.remove(); }).catch(() => { try { localStorage.removeItem('px_coupon'); } catch {} });
}
start();
</script>
</body>
</html>
