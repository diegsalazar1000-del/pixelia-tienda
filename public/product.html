<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>{{TITLE}}</title>
<meta name="description" content="{{DESC}}">
<meta property="og:type" content="product">
<meta property="og:title" content="{{TITLE}}">
<meta property="og:description" content="{{DESC}}">
<meta property="og:image" content="{{IMAGE}}">
<meta name="theme-color" content="#07060f">
{{PIXEL}}
<link rel="icon" href="/favicon.svg">
<link rel="stylesheet" href="/css/styles.css">
<style>
.offer{margin:14px 0;padding:14px 16px;border-radius:16px;background:linear-gradient(135deg,#7c5cff33,#ff4fa333);border:1px solid #ffffff22}
.offer h4{margin:0 0 6px;font-size:1.02rem}.offer p{margin:4px 0;color:var(--dim,#aab);font-size:.92rem}
.offer .row{display:flex;gap:8px;margin-top:8px}.offer input{flex:1;min-width:0}.offer .btn{white-space:nowrap}
.pack-list{list-style:none;padding:0;margin:8px 0}.pack-list li{padding:4px 0}
.coupon-line{margin:8px 0 0;font-size:.9rem}.coupon-line a{color:#b9a6ff;cursor:pointer}
.ok{color:#5fe3a1}
.gancho{font-size:clamp(1.55rem,6.5vw,2.3rem);line-height:1.12;font-weight:900;margin:6px 0 8px;letter-spacing:-.02em;background:linear-gradient(90deg,#fff,#c9b8ff 55%,#ff9bd2);-webkit-background-clip:text;background-clip:text;color:transparent}
.pdp h1.sub{font-size:1.05rem;font-weight:700;color:var(--dim,#c8c8d8);margin:0 0 6px}
.cd{display:inline-block;line-height:1.35;margin:2px 0 12px;padding:8px 12px;border-radius:16px;background:#ff4fa31f;border:1px solid #ff4fa355;font-weight:700;font-size:.92rem}
.cd b{color:#ff9bd2;font-size:1.05rem}
.gal-h{margin:26px 0 10px}.gal{display:flex;align-items:flex-start;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:8px;-webkit-overflow-scrolling:touch}
.gal figure{flex:0 0 82%;max-width:420px;margin:0;scroll-snap-align:start;border:1px solid var(--line,#ffffff1f);border-radius:16px;overflow:hidden;background:#ffffff08}
.gal img,.gal video{display:block;width:100%;height:auto;background:#fff}
.gal figcaption{padding:9px 12px;font-size:.88rem;color:var(--dim,#c8c8d8)}
.faq{margin-top:26px}.faq h3{margin:0 0 10px}.faq details{border:1px solid var(--line,#ffffff1f);border-radius:14px;margin:8px 0;background:#ffffff06}
.faq summary{cursor:pointer;padding:12px 14px;font-weight:700;list-style:none}.faq summary::-webkit-details-marker{display:none}
.faq summary:after{content:'+';float:right;color:#b9a6ff;font-weight:900}.faq details[open] summary:after{content:'–'}
.faq details p{margin:0;padding:0 14px 12px;color:var(--dim,#c8c8d8);line-height:1.5}
</style>
<script>/* SDK de Telegram SOLO dentro de Telegram: afuera bloqueaba la carga de la página */try{if(/tgWebApp/.test(location.hash+location.search))sessionStorage.tg=1}catch(e){}if(window.TelegramWebviewProxy||window.external&&window.external.notify&&/Telegram/i.test(navigator.userAgent)||/Telegram/i.test(navigator.userAgent)||/tgWebApp/.test(location.hash+location.search)||(function(){try{return sessionStorage.tg}catch(e){}})())document.write('<script src="https://telegram.org/js/telegram-web-app.js"><\/script>')</script>
<script src="/js/medir.js" defer></script>
</head>
<body>
<div class="bg-orbs"><span></span><span></span><span></span></div><div class="bg-grid"></div>
<header class="top"><div class="wrap">
  <a class="logo" href="/"><i>✦</i><span>{{STORE}}</span></a>
  <nav class="nav"><a href="/#catalogo" data-t="catalog">Catálogo</a><button class="lang">EN</button></nav>
</div></header>

<main class="wrap pdp" id="pdp"></main>

<footer><div class="wrap"><span>{{STORE}}</span><span><a href="/legal">Términos y privacidad</a></span></div></footer>

<script src="/js/common.js"></script>
<script>
const P = {{DATA}};
let CFG = {}, METHOD = '', ORDER = null;
const QS = new URLSearchParams(location.search);
let PRICE = P.price, COUPON = '', UPSELL = null;   // precio final, cupón aplicado, oferta "completa tu pack"

let BUMP = false;
function priceBox() {
  const off = P.compare > PRICE ? Math.round((1 - PRICE / P.compare) * 100) : 0;
  const was = UPSELL ? UPSELL.normal : COUPON ? P.price : P.compare;
  return `<b>${inTelegram ? P.stars + ' ⭐' : money(PRICE)}</b>${!inTelegram && was > PRICE ? `<s>${money(was)}</s><span class="save">-${Math.round((1 - PRICE / was) * 100)}%</span>` : (off && !inTelegram ? `<s>${money(P.compare)}</s><span class="save">-${off}%</span>` : '')}`;
}
function refreshPrice() { const b = $('.big-price'); if (b) b.innerHTML = priceBox(); }

function offersHtml() {
  if (inTelegram) return '';
  let h = '';
  if (UPSELL) h += `<div class="offer"><h4>🎁 Oferta solo para ti: completa tu pack</h4><p>Por haber comprado, te llevas ${UPSELL.items.map((i) => `${escH(i.emoji)} <b>${escH(i.title)}</b>`).join(' + ')} por solo <b>${money(UPSELL.price)}</b> (normalmente ${money(UPSELL.normal)}).</p></div>`;
  if (P.pack) h += `<div class="offer"><h4>📦 Este pack incluye</h4><ul class="pack-list">${P.pack.map((i) => `<li>${escH(i.emoji)} ${escH(i.title)} <small style="color:var(--dim)">(${money(i.price)})</small></li>`).join('')}</ul></div>`;
  for (const k of (P.packs || []).slice(0, 1)) h += `<a class="offer" style="display:block;text-decoration:none;color:inherit" href="/p/${encodeURIComponent(k.slug)}">
      <h4>🔥 Llévate los ${k.items.length} por ${money(k.price)}</h4><p>${k.items.map((i) => escH(i.emoji) + ' ' + escH(i.title)).join(' · ')}</p>
      <p><b>Ahorras ${money(k.save)}</b> · <u>Ver el pack →</u></p></a>`;
  if (!P.pack && !UPSELL) h += P.sample ? `<div class="offer" id="welcome"><h4>🎁 Pruébalo gratis + 15% de descuento</h4>
      <p>Déjanos tu correo: te mandamos <b>${escH(P.sample.title)}</b> gratis y un cupón de 15% para tu primera compra.</p>
      <div class="row"><input id="subEmail" type="email" placeholder="tu@correo.com" autocomplete="email"><button class="btn btn-main" id="subBtn">Quiero la muestra</button></div>
      <p class="err" id="subErr"></p></div>`
    : `<div class="offer" id="welcome"><h4>🎁 ¿Primera compra? 15% de descuento</h4>
      <p>Déjanos tu correo y te damos tu cupón al instante (también te avisamos de novedades).</p>
      <div class="row"><input id="subEmail" type="email" placeholder="tu@correo.com" autocomplete="email"><button class="btn btn-main" id="subBtn">Quiero mi 15%</button></div>
      <p class="err" id="subErr"></p></div>`;
  if (P.regalo && !UPSELL) h += `<a class="offer" style="display:block;text-decoration:none;color:inherit;background:linear-gradient(135deg,#ff6b3d33,#14b8a633)" href="${escH(P.regalo.url)}">
      <h4>🤔 ¿Todavía no te decides?</h4><p>Empieza <b>gratis</b> con <b>${escH(P.regalo.title)}</b>: te lo mandamos al correo y, si te gusta, aquí te espera el completo con tu 15%.</p>
      <p><b><u>Quiero empezar gratis →</u></b></p></a>`;
  return h;
}

function wireOffers() {
  const sb = $('#subBtn'); if (!sb) return;
  sb.onclick = async () => {
    $('#subErr').textContent = ''; sb.disabled = true;
    try {
      const email = $('#subEmail').value.trim();
      const r = await api('/api/subscribe', { method: 'POST', body: { email, source: P.slug, sample: !!P.sample } });
      fbq('track', 'Lead', { content_name: P.sample ? 'muestra-gratis' : 'cupon-bienvenida' });
      if (r.code) { try { localStorage.setItem('px_coupon', r.code); } catch {} await applyCoupon(r.code, true); }
      if ($('#email') && !$('#email').value) $('#email').value = email;
      $('#welcome').innerHTML = (r.sample ? `<h4 class="ok">✅ ¡Tu muestra está lista!</h4><p><a class="btn btn-main" style="display:inline-block;margin:4px 0" href="${escH(r.sample.url)}" target="_blank" rel="noopener">⬇️ Descargar ${escH(r.sample.title)}</a></p>` : '')
        + (r.code ? `<p class="ok">🎟️ Cupón <b>${escH(r.code)}</b> aplicado (-${r.off}%). También te lo enviamos por correo.</p>` : '');
    } catch (e) { $('#subErr').textContent = e.message; sb.disabled = false; }
  };
}

async function applyCoupon(code, silent) {
  const r = await api('/api/coupon', { method: 'POST', body: { slug: P.slug, code } });
  COUPON = r.code; PRICE = r.price; refreshPrice();
  const cl = $('#couponLine'); if (cl) cl.innerHTML = `<span class="ok">✅ Cupón ${escH(r.code)} aplicado: -${r.off}%</span>`;
  if (METHOD === 'paypal') pick('paypal');  // vuelve a dibujar PayPal con el precio nuevo
  return r;
}

function countdownHtml() {
  if (!P.countdown || !P.countdown.date) return '';
  const days = Math.ceil((Date.parse(P.countdown.date + 'T00:00:00') - Date.now()) / 864e5);
  if (!(days > 0 && days < 400)) return '';
  return `<div class="cd reveal">⏳ Faltan <b>${days}</b> ${days === 1 ? 'día' : 'días'} ${escH(P.countdown.label || '')}</div>`;
}
function galleryHtml() {
  const G = P.gallery || [];
  if (!G.length && !P.video) return '';
  return `<h3 class="gal-h reveal">👀 Míralo por dentro</h3><div class="gal reveal">`
    + (P.video ? `<figure><video src="${escH(P.video)}" autoplay muted loop playsinline preload="metadata"></video><figcaption>▶️ Así funciona</figcaption></figure>` : '')
    + G.map((g) => `<figure><img loading="lazy" src="${escH(g.url)}" alt="${escH(g.cap || P.title)}"><figcaption>${escH(g.cap || '')}</figcaption></figure>`).join('') + '</div>';
}
const FAQ_GEN = [
  ['¿Cómo lo recibo?', 'Apenas se confirma tu pago te llega a tu correo (y por WhatsApp o Telegram si los pones) con el enlace de descarga. Puedes descargarlo hasta 5 veces.'],
  ['¿Cómo pago con Binance?', 'Elige "Binance", abre tu app de Binance → Pay → Enviar, y manda exactamente el monto en USDT que te mostramos al Pay ID (o escanea el QR). Luego pegas el ID de orden que te da Binance y tocas "Ya pagué". Normalmente lo confirmamos en pocos minutos.'],
  ['¿Puedo pagar con tarjeta?', 'Sí, con PayPal puedes pagar con tu tarjeta de débito o crédito, aunque no tengas cuenta de PayPal.'],
  ['¿Es una suscripción?', 'No. Pagas una sola vez y el archivo es tuyo.'],
  ['¿Y si no me funciona?', 'Te lo arreglamos o te devolvemos el dinero. Escríbenos por Telegram y te ayudamos.'],
];
function faqHtml() {
  const L = [...(P.faq || []).map((f) => [f.q, f.a]), ...FAQ_GEN].filter((f) => f[0] && f[1]);
  return `<div class="faq reveal"><h3>❓ Preguntas frecuentes</h3>${L.map(([q, a]) => `<details><summary>${escH(q)}</summary><p>${escH(a)}</p></details>`).join('')}</div>`;
}

const RV_LAB = { compra: '✅ Compra verificada', regalo: '🎁 Descargó el regalo', gratis: '🎁 Lo recibió gratis para opinar' };
function reviewsHtml() {
  const R = P.reviews || [];
  if (!R.length) return '';
  return `<div class="reveal" id="resenas" style="margin-top:26px"><h3 style="margin:0 0 10px">⭐ Opiniones reales (${P.rating.avg} de 5)</h3>` + R.map((r) =>
    `<div style="padding:12px 14px;border:1px solid var(--line);border-radius:16px;margin:8px 0;background:#ffffff08">
      <div style="color:#ffc83d">${'★'.repeat(r.stars)}<span style="color:#ffffff33">${'★'.repeat(5 - r.stars)}</span></div>
      ${r.text ? `<p style="margin:6px 0">${escH(r.text)}</p>` : ''}
      <div style="font-size:.82rem;color:var(--mut)">${escH(r.name || 'Cliente')} · ${RV_LAB[r.source] || ''} · ${escH(String(r.created_at).slice(0, 10))}</div></div>`).join('') + '</div>';
}

function view() {
  if (P.form && P.form !== 'aventura') {   // se compra desde su landing (ahí se llenan los datos)
    if (!FPRE) { location.replace('/' + ({ plan: 'plan' }[P.form] || '')); return; }
    $('#pdp').innerHTML = `<div style="grid-column:1/-1;max-width:560px;width:100%;margin:0 auto">
      <p style="margin:0 0 6px"><a href="/plan" style="color:var(--mut)">← Volver</a></p>
      <h1 style="font-size:1.6rem;line-height:1.2;margin:0 0 6px">🎉 Último paso: tu plan 2027</h1>
      <p class="short" style="margin:0 0 10px">⚡ Descarga inmediata: apenas pagas, te llega al correo tu Excel (también abre en Google Sheets) con tus números ya puestos.</p>
      <div class="big-price">${priceBox()}</div>
      <div class="checkout" id="checkout"></div>
      <p class="hint" style="margin-top:14px">✅ Pago único, sin suscripción · 💬 Soporte por Telegram · Garantía: si falla, te lo arreglamos o te devolvemos el dinero.</p></div>`;
    return;
  }
  if (AVPRE && P.form === 'aventura') {   // paso de pago limpio (sin galería, FAQ ni descripción)
    const n = escH(AVPRE.datos?.nombre || '');
    $('#pdp').innerHTML = `<div style="grid-column:1/-1;max-width:560px;width:100%;margin:0 auto">
      <p style="margin:0 0 6px"><a href="/aventura" style="color:var(--mut)">← Volver</a></p>
      <h1 style="font-size:1.6rem;line-height:1.2;margin:0 0 6px">🎉 Último paso: la aventura de ${n}</h1>
      <p class="short" style="margin:0 0 10px">⚡ Descarga inmediata: apenas pagas, el libro llega a tu correo listo para imprimir.</p>
      <div class="big-price">${priceBox()}</div>
      <div class="checkout" id="checkout"></div>
      <p class="hint" style="margin-top:14px">✅ Pago único, sin suscripción · 💬 Soporte por Telegram · Garantía: si falla, te lo arreglamos o te devolvemos el dinero.</p></div>`;
    return;
  }
  const off = P.compare > P.price ? Math.round((1 - P.price / P.compare) * 100) : 0;
  $('#pdp').innerHTML = `
  <div class="media reveal"><img src="${escH(P.cover)}" alt="${escH(P.title)}"></div>
  <div>
    <div class="crumbs reveal"><a href="/">Inicio</a> / <a href="/#catalogo">${escH(P.category)}</a></div>
    ${P.gancho ? `<p class="gancho reveal">${escH(P.gancho)}</p><h1 class="sub reveal">${escH(P.emoji)} ${escH(P.title)}</h1>` : `<h1 class="reveal">${escH(P.emoji)} ${escH(P.title)}</h1>`}
    ${P.rating && P.rating.n ? `<a href="#resenas" class="reveal" style="display:inline-block;margin:-4px 0 8px;color:#ffc83d;text-decoration:none">${'★'.repeat(Math.round(P.rating.avg))}${'☆'.repeat(5 - Math.round(P.rating.avg))} <span style="color:var(--mut)">${P.rating.avg} · ${P.rating.n} ${P.rating.n === 1 ? 'opinión' : 'opiniones'}</span></a>` : ''}
    <p class="short reveal">${escH(P.short)}</p>
    <div class="big-price reveal">${priceBox()}</div>
    ${countdownHtml()}
    <div class="checkout reveal" id="checkout"></div>
    <div class="feats reveal"><div>⚡ ${t('instant')}</div><div>📩 Correo · Telegram · WhatsApp</div><div>🔁 Descarga hasta 5 veces</div><div>💬 Soporte por Telegram</div><div>✅ Garantía: si tu archivo falla, lo arreglamos o te devolvemos el dinero</div></div>
    ${offersHtml()}
    ${galleryHtml()}
    <div class="desc reveal">${escH(P.description)}</div>
    ${reviewsHtml()}
    ${faqHtml()}
  </div>`;
  enhance(); wireOffers();
}

function checkoutTelegram() {
  $('#checkout').innerHTML = `<h3>${t('stars')}</h3>
    <button class="btn btn-main btn-block" id="starsBtn">Comprar por ${P.stars} ⭐</button>
    <p class="hint">Recibirás el archivo en este chat al instante.</p><div class="err" id="err"></div>`;
  $('#starsBtn').onclick = async () => {
    $('#starsBtn').disabled = true; $('#err').textContent = '';
    try {
      const { link } = await api('/api/stars/invoice', { method: 'POST', body: { slug: P.slug, initData: TG.initData } });
      TG.openInvoice(link, (status) => {
        $('#starsBtn').disabled = false;
        if (status === 'paid') { TG.HapticFeedback?.notificationOccurred('success');
          $('#checkout').innerHTML = `<h3>🎉 ¡Pago completado!</h3><p class="hint">Te enviamos el producto al chat del bot.</p>
            <button class="btn btn-ghost btn-block" onclick="TG.close()">Ir al chat</button>`; }
      });
    } catch (e) { $('#err').textContent = e.message; $('#starsBtn').disabled = false; }
  };
}

function checkoutWeb() {
  const methods = [];
  if (CFG.paypal) methods.push(['paypal', 'PayPal', 'Tarjeta o saldo']);
  if (CFG.binance) methods.push(['binance', 'Binance', 'USDT · Pay']);
  if (CFG.pagomovil && esVenezuela()) methods.push(['pagomovil', 'Pago Móvil', 'Bolívares · tasa BCV']);
  if (CFG.bot && P.stars && !P.form) methods.push(['stars', '⭐ Stars', 'en Telegram']);
  if (!methods.length) { $('#checkout').innerHTML = '<p class="hint">Los pagos aún no están configurados.</p>'; return; }
  $('#checkout').innerHTML = (P.form === 'aventura' ? formAventura() : '') + `
    <h3>${t('sendTo')}</h3>
    <div class="field"><label>${t('email')}</label><input id="email" type="email" placeholder="tu@correo.com" autocomplete="email"></div>
    ${CFG.whatsapp ? `<div class="field"><label>${t('whatsapp')}</label><input id="wa" type="tel" placeholder="+58 412 1234567" autocomplete="tel"></div>` : ''}
    <h3 style="margin-top:18px">${t('payWith')}</h3>
    <div class="methods">${methods.map(([k, n, s]) => `<button class="method" data-m="${k}">${n}<small>${s}</small></button>`).join('')}</div>
    <div id="pay"></div><div class="err" id="err"></div>
    ${P.bump && !UPSELL ? `<label class="bump" style="display:flex;gap:12px;align-items:center;margin:16px 0 4px;padding:12px;border:2px dashed #ffc83d88;border-radius:16px;background:#ffc83d12;cursor:pointer">
      <input type="checkbox" id="bumpChk" style="width:22px;height:22px;flex:none">
      <img src="${escH(P.bump.cover)}" alt="" style="width:54px;height:54px;border-radius:10px;object-fit:cover;flex:none">
      <span style="font-size:.92rem"><b>🛒 Comprados juntos habitualmente:</b> agrega <b>${escH(P.bump.emoji || '')} ${escH(P.bump.title)}</b> por <b>${money(P.bump.bumpPrice)}</b> <s style="opacity:.6">${money(P.bump.price)}</s> <span class="save">-20%</span><br><small style="color:var(--mut)">${escH(P.bump.short || '')}</small></span></label>` : ''}
    ${!P.pack && !UPSELL ? `<p class="coupon-line" id="couponLine"><a id="haveCoupon">¿Tienes un cupón?</a></p>` : ''}`;
  const hc = $('#haveCoupon');
  if (hc) hc.onclick = () => {
    $('#couponLine').innerHTML = `<span class="row" style="display:flex;gap:8px"><input id="cpn" placeholder="HOLA-XXXXXX" style="flex:1"><button class="btn btn-ghost" id="cpnBtn">Aplicar</button></span>`;
    $('#cpnBtn').onclick = () => applyCoupon($('#cpn').value).catch((e) => { $('#err').textContent = e.message; });
  };
  $('.methods').onclick = (e) => { const b = e.target.closest('.method'); if (b) pick(b.dataset.m); };
  const bc = $('#bumpChk'); if (bc) bc.onchange = () => { BUMP = bc.checked;
    if (METHOD === 'binance' && ORDER) { ORDER = null; $('.methods').style.display = ''; pick('binance'); }  // el importe cambia: hay que generar el pedido de nuevo
    const bp = $('.big-price'); if (bp) bp.innerHTML = priceBox() + (BUMP ? ` <small style="color:var(--mut)">+ ${money(P.bump.bumpPrice)} = <b>${money(Math.round((PRICE + P.bump.bumpPrice) * 100) / 100)}</b></small>` : ''); };
  prepAventura();
  if (FPRE?.email && $('#email') && !$('#email').value) $('#email').value = FPRE.email;
  pick(methods[0][0]);
}

function esVenezuela() { try { return Intl.DateTimeFormat().resolvedOptions().timeZone === 'America/Caracas'; } catch { return false; } }

// 📚 Mi Gran Aventura: los datos del niño para armar su libro (todo opcional menos nombre y edad)
const COMPS = [['perrito', '🐶 Perrito'], ['gatito', '🐱 Gatito'], ['dinosaurio', '🦖 Dinosaurio'], ['unicornio', '🦄 Unicornio'], ['dragon', '🐉 Dragón'], ['robot', '🤖 Robot'], ['loro', '🦜 Loro'], ['amigo', '🧒 Un amigo'], ['otro', '✍️ Otro']];
// Viene de la landing /aventura (?compra=1): datos y correo ya puestos → solo el paso de pago
let AVPRE = null; try { if (QS.get('compra')) AVPRE = JSON.parse(sessionStorage.getItem('px_av') || 'null'); } catch {}
// Otros personalizados (ej. plan financiero): los datos vienen de su landing en sessionStorage px_form_<slug>
let FPRE = null; try { if (QS.get('compra')) FPRE = JSON.parse(sessionStorage.getItem('px_form_' + P.slug) || 'null'); } catch {}
function formAventura() {
  const d = AVPRE && AVPRE.datos;
  const res = d ? `<details class="avd" style="margin:0 0 14px;padding:10px 14px;border:1px solid var(--line);border-radius:14px"><summary style="cursor:pointer">📚 Libro para <b>${escH(d.nombre)}</b> · ${d.edad} años <small style="color:var(--mut)">(tocar para cambiar)</small></summary>` : '';
  return res + `<h3>📚 ¿Para quién es la aventura?</h3>
    <div class="field"><label>Nombre del niño o niña *</label><input id="avNom" maxlength="20" placeholder="Ej: Sofía"></div>
    <div class="field"><label>Edad *</label><select id="avEdad">${[2, 3, 4, 5, 6, 7, 8].map((e) => `<option value="${e}" ${e === 5 ? 'selected' : ''}>${e} años</option>`).join('')}</select></div>
    <div class="field"><label>Es…</label><select id="avGen"><option value="nina">Niña (heroína)</option><option value="nino">Niño (héroe)</option></select></div>
    <div class="field"><label>Su compañero de aventura</label><select id="avComp">${COMPS.map(([k, v]) => `<option value="${k}">${v}</option>`).join('')}</select></div>
    <div class="field" id="avOtroF" style="display:none"><label>¿Qué es su compañero?</label><input id="avOtro" maxlength="20" placeholder="Ej: un conejito, su hermana, una tortuga"></div>
    <div class="field"><label>Nombre del compañero <small>(su mascota real o uno inventado)</small></label><input id="avCompN" maxlength="16" placeholder="Ej: Coco"></div>
    <div class="field"><label>Alguien que quiere mucho <small>(opcional)</small></label><input id="avEsp" maxlength="30" placeholder="Ej: la abuela Rosa, el tío Juan"></div>
    <p class="hint" style="margin-top:-4px">✨ Con esto armamos su libro: misiones de su edad, su nombre en cada página y un QR que lo felicita con su nombre.</p>` + (d ? '</details>' : '');
}
function prepAventura() {   // muestra "¿qué es?" con Otro y pone los datos que trajo de la landing
  if (P.form !== 'aventura' || !$('#avComp')) return;
  const sh = () => { $('#avOtroF').style.display = $('#avComp').value === 'otro' ? '' : 'none'; };
  $('#avComp').onchange = sh;
  const d = AVPRE && AVPRE.datos;
  if (d) { $('#avNom').value = d.nombre || ''; $('#avEdad').value = String(d.edad || 5); $('#avGen').value = d.genero || 'nina';
    $('#avComp').value = d.comp_tipo || 'perrito'; $('#avOtro').value = d.comp_otro || ''; $('#avCompN').value = d.comp_nombre || ''; $('#avEsp').value = d.especial || '';
    if ($('#email') && AVPRE.email) $('#email').value = AVPRE.email; }
  sh();
}
function datosAventura() {
  if (P.form !== 'aventura') return undefined;
  const d = { nombre: $('#avNom').value.trim(), edad: Number($('#avEdad').value), genero: $('#avGen').value, comp_tipo: $('#avComp').value, comp_otro: $('#avOtro').value.trim(), comp_nombre: $('#avCompN').value.trim(), especial: $('#avEsp').value.trim() };
  if (d.comp_tipo === 'otro' && !d.comp_otro) { const de = $('.avd'); if (de) de.open = true; $('#avOtro').focus(); throw new Error('Escribe qué es su compañero de aventura 😊'); }
  if (!d.nombre) { const de = $('.avd'); if (de) de.open = true; $('#avNom').focus(); throw new Error('Escribe el nombre del niño o niña para su libro 😊'); }
  return d;
}

function contact() {
  const email = $('#email').value.trim(), whatsapp = $('#wa')?.value.trim() || '';
  if (!email && !whatsapp) throw new Error('Escribe tu correo para enviarte el producto.');
  if (email && !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) throw new Error('Revisa tu correo.');
  return { email, whatsapp };
}

async function createOrder(method) {
  $('#err').textContent = '';
  ORDER = await api('/api/orders', { method: 'POST', body: { slug: P.slug, method, lang: LANG, ...contact(), datos: datosAventura() ?? FPRE?.datos,
    coupon: COUPON || undefined, upsell: UPSELL ? { id: QS.get('up'), key: QS.get('k') } : undefined, bump: BUMP && P.bump ? P.bump.slug : undefined } });
  fbq('track', 'InitiateCheckout', { content_ids: BUMP && P.bump ? [P.slug, P.bump.slug] : [P.slug], value: BUMP && P.bump ? PRICE + P.bump.bumpPrice : PRICE, currency: 'USD' });
  return ORDER;
}

function pick(m) {
  METHOD = m; $$('.method').forEach((b) => b.classList.toggle('on', b.dataset.m === m)); $('#err').textContent = '';
  const pay = $('#pay');
  if (m === 'paypal') { pay.innerHTML = '<div id="paypal-buttons"></div>'; loadPaypal(); }
  if (m === 'binance') {
    pay.innerHTML = `<button class="btn btn-main btn-block" id="bnBtn">${t('continue')} con Binance</button>`;
    $('#bnBtn').onclick = async () => {
      try { $('#bnBtn').disabled = true; const o = await createOrder('binance'); binanceSteps(o); }
      catch (e) { $('#err').textContent = e.message; $('#bnBtn').disabled = false; }
    };
  }
  if (m === 'pagomovil') {
    pay.innerHTML = `<button class="btn btn-main btn-block" id="pmBtn">${t('continue')} con Pago Móvil</button>`;
    $('#pmBtn').onclick = async () => {
      try { $('#pmBtn').disabled = true; const o = await createOrder('pagomovil'); pagoMovilSteps(o); }
      catch (e) { $('#err').textContent = e.message; $('#pmBtn').disabled = false; }
    };
  }
  if (m === 'stars') pay.innerHTML = `<a class="btn btn-main btn-block" href="https://t.me/${CFG.bot}?start=p_${encodeURIComponent(P.slug)}" target="_blank">Abrir en Telegram · ${P.stars} ⭐</a>
    <p class="hint">Pagas con Telegram Stars dentro del bot y recibes el archivo en el chat.</p>`;
}

function loadPaypal() {
  const render = () => paypal.Buttons({
    style: { shape: 'pill', color: 'gold', layout: 'vertical', label: 'pay' },
    onClick: (_, actions) => { try { contact(); datosAventura(); return actions.resolve(); } catch (e) { $('#err').textContent = e.message; return actions.reject(); } },
    createOrder: async () => (await createOrder('paypal')).paypalId,
    onApprove: async () => {
      $('#pay').innerHTML = '<div class="spinner"></div>';
      try { await api('/api/paypal/capture', { method: 'POST', body: { id: ORDER.id, key: ORDER.key } }); }
      catch (e) { $('#err').textContent = e.message; }
      location.href = `/pedido/${ORDER.id}?k=${ORDER.key}`;
    },
    onError: () => { $('#err').textContent = 'PayPal no pudo procesar el pago. Inténtalo de nuevo.'; },
  }).render('#paypal-buttons');
  if (window.paypal) return render();
  const s = document.createElement('script');
  s.src = `https://www.paypal.com/sdk/js?client-id=${encodeURIComponent(CFG.paypal.clientId)}&currency=USD&intent=capture`;
  s.onload = render; s.onerror = () => { $('#err').textContent = 'No se pudo cargar PayPal.'; };
  document.head.appendChild(s);
}

function pagoMovilSteps(o) {
  $('.methods').style.display = 'none';
  const fila = (k, v) => `<div class="copy"><span style="opacity:.75">${k}</span> <b>${escH(v)}</b><button data-c="${escH(v)}">${t('copy')}</button></div>`;
  $('#pay').innerHTML = `
    <div class="box"><ol class="binance">
      <li>Abre tu banco → <b>Pago Móvil</b> y paga <b>exactamente</b>:${fila('Monto Bs', Number(o.bs).toLocaleString('es-VE', { minimumFractionDigits: 2, maximumFractionDigits: 2 }))}
        <div style="font-size:.82rem;color:var(--mut)">$${o.usd} a la tasa oficial BCV de hoy (Bs ${Number(o.tasa).toFixed(2)}). Paga los céntimos exactos: así reconocemos tu pago al instante.</div></li>
      <li>A estos datos:${fila('Banco', o.banco)}${fila('Teléfono', o.tel)}${fila('Cédula / RIF', o.ci)}${o.nombre ? fila('A nombre de', o.nombre) : ''}</li>
      <li>Escribe la <b>referencia</b> del pago y el teléfono desde el que pagaste:</li>
    </ol>
    <div class="field" style="margin-top:10px"><input id="ref" placeholder="Número de referencia" inputmode="numeric"></div>
    <div class="field"><input id="pmTel" placeholder="Tu teléfono (ej: 0414 1234567)" inputmode="tel"></div>
    <button class="btn btn-main btn-block" id="sendRef">Ya pagué</button>
    <p class="hint">Pedido <b>${o.id}</b>. Lo confirmamos en cuanto veamos el pago (normalmente en minutos) y te llega al correo.</p></div>`;
  $$('.copy button').forEach((b) => (b.onclick = () => copyText(b.dataset.c)));
  $('#sendRef').onclick = async () => {
    $('#sendRef').disabled = true; $('#err').textContent = '';
    try { await api('/api/pagomovil/submit', { method: 'POST', body: { id: o.id, key: o.key, ref: $('#ref').value, tel: $('#pmTel').value } }); location.href = `/pedido/${o.id}?k=${o.key}`; }
    catch (e) { $('#err').textContent = e.message; $('#sendRef').disabled = false; }
  };
}

function binanceSteps(o) {
  $('.methods').style.display = 'none';
  $('#pay').innerHTML = `
    <div class="box"><ol class="binance">
      <li>Abre Binance → <b>Pay</b> → <b>Enviar</b>.</li>
      <li>Envía <b>exactamente</b> este importe en USDT (los céntimos identifican tu pedido):
        <div class="copy"><b>${o.amount} USDT</b><button data-c="${o.amount}">${t('copy')}</button></div></li>
      <li>Al Binance Pay ID:<div class="copy"><b>${escH(o.payId)}</b><button data-c="${escH(o.payId)}">${t('copy')}</button></div>
        <div class="bqr" style="margin-top:10px;text-align:center"><img src="/binance-qr.jpg" alt="QR de Binance Pay" style="display:block;margin:0 auto 6px;width:180px;max-width:70%;border-radius:14px;background:#fff;padding:8px" onerror="this.parentNode.remove()">
        <div style="font-size:.82rem;color:var(--mut)">o escanéalo desde Binance → Pay → Escanear</div></div></li>
      <li>Copia el <b>ID de orden</b> que te muestra Binance y pégalo aquí:</li>
    </ol>
    <div class="field" style="margin-top:10px"><input id="ref" placeholder="ID de orden de Binance" inputmode="numeric"></div>
    <button class="btn btn-main btn-block" id="sendRef">Ya pagué</button>
    <p class="hint">Pedido <b>${o.id}</b>. Normalmente lo confirmamos en pocos minutos.</p></div>`;
  $$('.copy button').forEach((b) => (b.onclick = () => copyText(b.dataset.c)));
  $('#sendRef').onclick = async () => {
    $('#sendRef').disabled = true; $('#err').textContent = '';
    try {
      await api('/api/binance/submit', { method: 'POST', body: { id: o.id, key: o.key, ref: $('#ref').value } });
      location.href = `/pedido/${o.id}?k=${o.key}`;
    } catch (e) { $('#err').textContent = e.message; $('#sendRef').disabled = false; }
  };
}

async function start() {
  // ¿Viene de "completa tu pack"? (enlace desde la página del pedido)
  if (QS.get('up') && QS.get('k') && P.pack) {
    try {
      const o = await api(`/api/orders/${encodeURIComponent(QS.get('up'))}?k=${encodeURIComponent(QS.get('k'))}`);
      if (o.upsell && o.upsell.slug === P.slug) { UPSELL = o.upsell; PRICE = o.upsell.price; UPSELL.email = o.email; }
    } catch {}
  }
  view();
  fbq('track', 'ViewContent', { content_ids: [P.slug], content_type: 'product', value: PRICE, currency: 'USD' });
  if (inTelegram) return checkoutTelegram();
  CFG = await api('/api/config'); checkoutWeb();
  if (UPSELL?.email && $('#email')) $('#email').value = UPSELL.email;
  // cupón guardado de una visita anterior
  let saved = ''; try { saved = QS.get('cupon') || localStorage.getItem('px_coupon') || ''; if (QS.get('cupon')) localStorage.setItem('px_coupon', saved); } catch {}  // ?cupon= viene del correo
  if (saved && !P.pack && !UPSELL) applyCoupon(saved).then(() => { const w = $('#welcome'); if (w) w.remove(); }).catch(() => { try { localStorage.removeItem('px_coupon'); } catch {} });
}
start();
</script>
</body>
</html>
